# mdBook configuration for the LC-JSON Specification site.
# Renders the contents of src/ to a static HTML site for hosting at lc-json.org.
#
# Build: `mdbook build` (output goes to ./book/)
# Serve locally: `mdbook serve --open`

[book]
title = "LC-JSON Specification"
authors = ["Brent Miller"]
description = "An open learning-content interchange specification."
src = "src"
language = "en"

[rust]
edition = "2021"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
mathjax-support = false
no-section-label = false
git-repository-url = "https://github.com/lc-json/specification"
# (git-repository-icon omitted — mdbook auto-detects github URL and applies the right icon.
#  The legacy "fa-github" value is invalid in FontAwesome 6 / mdbook v0.5+; the explicit
#  alternative would be "fa-brands fa-github" but auto-detect is cleaner.)
edit-url-template = "https://github.com/lc-json/specification/edit/main/src/{path}"
site-url = "/"
cname = "lc-json.org"

[output.html.print]
enable = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
