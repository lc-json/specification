name: Build and deploy spec site

# Builds the mdBook site from src/, copies schemas/examples/tests/tools
# alongside, and publishes the result to the gh-pages branch.
#
# Triggers: push to main, plus manual run via workflow_dispatch.
#
# Pages serves https://lc-json.org from the gh-pages branch.
# Schemas resolve at https://lc-json.org/<version>/<file>.schema.json
# (/1.1/ is the current publication; /1.1-rc.1/, /1.0/, and /1.0-rc.1..3/ stay served and frozen).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write    # needed for peaceiris/actions-gh-pages to push

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  conformance:
    # Runs the LC-JSON conformance corpus on every push and PR. The site
    # build job depends on this, so a corpus failure blocks deployment.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: pip install -r tools/requirements.txt

      - name: Run conformance corpus (strict)
        # The validators use a three-state exit contract: 0 = conforming,
        # 1 = a real conformance failure, 3 = validation unavailable /
        # indeterminate (a dependency or schema set is missing, so nothing was
        # actually checked). Both non-zero codes fail this job — an unverified
        # corpus must never deploy — but they are DIFFERENT problems and get
        # different messages. Reporting a missing dependency as "a corpus
        # regression" sends whoever is on the other end hunting for a spec bug
        # that does not exist.
        run: |
          set +e
          python tools/run_corpus.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          elif [ "$rc" -eq 3 ]; then
            echo "::error title=Conformance corpus could not run::The corpus exited 3 \
          (validation unavailable). Nothing was checked, so this is NOT a corpus \
          regression — the spec may be perfectly fine. Something in the environment is \
          missing: most likely the 'jsonschema' dependency failed to install, or a \
          publication's schema set is absent from the tree. Fix the environment and \
          re-run."
            exit 1
          else
            echo "::error title=Conformance corpus failed::The corpus exited $rc — one or \
          more fixtures did not behave as tests/manifest.json declares. This IS a \
          conformance regression; see the per-fixture output above."
            exit "$rc"
          fi

  build-and-deploy:
    needs: conformance
    # Only deploy on push to main; PRs run the build for verification only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build mdBook
        run: mdbook build

      # Copy schemas into the published output so they resolve at
      # lc-json.org/<version>/*.schema.json (the URL embedded in every
      # conforming JSON file's $schema field). 1.1 is the current publication;
      # the 1.1-rc.1 snapshot, 1.0, and its rc.1/rc.2/rc.3 snapshots stay
      # served and frozen alongside it per NORMATIVE.md §8.3.
      - name: Copy schemas to book output
        run: |
          mkdir -p book/1.1 book/1.1-rc.1 book/1.0 book/1.0-rc.1 book/1.0-rc.2 book/1.0-rc.3
          cp -v schemas/1.1/*.schema.json book/1.1/
          cp -v schemas/1.1-rc.1/*.schema.json book/1.1-rc.1/
          cp -v schemas/1.0/*.schema.json book/1.0/
          cp -v schemas/1.0-rc.1/*.schema.json book/1.0-rc.1/
          cp -v schemas/1.0-rc.2/*.schema.json book/1.0-rc.2/
          cp -v schemas/1.0-rc.3/*.schema.json book/1.0-rc.3/
          # No `book/schemas/` alias. Spec chapters used to link to a relative
          # `schemas/<name>.schema.json`, and this alias was added so those links
          # resolved on the flattened site. It only ever half-worked: the same links
          # still resolved to a nonexistent `src/schemas/*` when read on GitHub. Worse,
          # the alias was a MUTABLE URL sitting next to a specification whose central
          # schema promise is immutable versioned URLs (NORMATIVE.md §8.3), so a reader
          # could cite `/schemas/foo` and get a different publication after the next
          # release. Schema links in the spec chapters are instead rewritten to their
          # absolute versioned URL when this repository is generated, which fixes site
          # and GitHub navigation together and keeps every published link immutable.
          # Do not reintroduce this alias.

      # Copy examples, tests, and tools so they're browseable at
      # lc-json.org/<path>/. Documents in src/ link to these.
      - name: Copy examples to book output
        run: cp -rv examples book/examples

      - name: Copy conformance tests to book output
        run: cp -rv tests book/tests

      - name: Copy reference tools to book output
        run: cp -rv tools book/tools

      # Verify the schemas are reachable at the canonical paths.
      - name: Verify schema URL paths
        run: |
          # "<version>:<expected schema count>" — the count is per-publication:
          # the 1.0 series ships 23; 1.1 adds glossary, subject-collection,
          # curriculum-pack, and publication-fields for 27.
          for entry in 1.1:27 1.1-rc.1:27 1.0:23 1.0-rc.1:23 1.0-rc.2:23 1.0-rc.3:23; do
            v="${entry%:*}"
            expected="${entry#*:}"
            test -f book/$v/course.schema.json || (echo "ERROR: course.schema.json missing from book/$v/" && exit 1)
            test -f book/$v/question-set.schema.json || (echo "ERROR: question-set.schema.json missing from book/$v/" && exit 1)
            schema_count=$(ls book/$v/*.schema.json | wc -l)
            echo "Schemas at /$v/: $schema_count files"
            test "$schema_count" -eq "$expected" || (echo "ERROR: expected exactly $expected schemas at /$v/, got $schema_count" && exit 1)
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          publish_branch: gh-pages
          cname: lc-json.org
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
